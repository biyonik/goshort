version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goshort-postgres
    environment:
      POSTGRES_USER: goshort
      POSTGRES_PASSWORD: goshort_secret
      POSTGRES_DB: goshort
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: goshort-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
